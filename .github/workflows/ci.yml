name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Run automated gate
        run: |
          golangci-lint fmt --diff --config=.golangci.yml
          go mod tidy -diff
          go vet ./...
          golangci-lint run --config=.golangci.yml ./...
          go test -race -cover ./...
          go build ./...
