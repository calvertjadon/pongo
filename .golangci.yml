version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - goimports
    - golines
  settings:
    golines:
      max-len: 120

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - gochecksumtype
    - gocognit
    - gocritic
    - godoclint
    - ineffassign
    - nilerr
    - nolintlint
    - predeclared
    - revive
    - staticcheck
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        deterministic-core:
          files:
            - "**/internal/core/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/calvertjadon/pongo/internal/core
          deny:
            - pkg: "charm.land"
              desc: the deterministic core cannot depend on Charm
            - pkg: "github.com/charmbracelet"
              desc: the deterministic core cannot depend on Charm
            - pkg: "github.com/muesli/termenv"
              desc: the deterministic core cannot inspect terminals
            - pkg: "golang.org/x/term"
              desc: the deterministic core cannot inspect terminals
            - pkg: "github.com/xo/terminfo"
              desc: the deterministic core cannot inspect terminals
            - pkg: "golang.org/x/sys"
              desc: the host shell owns operating-system access
            - pkg: "os"
              desc: the host shell owns operating-system access
            - pkg: "syscall$"
              desc: the host shell owns operating-system access
            - pkg: "time$"
              desc: the shell supplies elapsed time as data
            - pkg: "math/rand"
              desc: the deterministic core cannot use ambient randomness
            - pkg: "crypto/rand"
              desc: the deterministic core cannot use ambient randomness
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 20
    staticcheck:
      checks:
        - "SA*"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
